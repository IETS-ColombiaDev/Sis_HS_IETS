# ============================================================================
#  Alembic - migraciones versionadas del esquema (fase 0, P0-1)
# ============================================================================
# Se ejecuta desde la carpeta backend/:
#   .\.venv\Scripts\python.exe -m alembic current
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "descripcion"
#
# La URL de la base NO se escribe aqui: env.py la toma de DATABASE_URL
# (app.config.settings, que lee backend/.env o el entorno). Para apuntar a otra
# base sin tocar .env:  alembic -x url=sqlite:///./otra.db upgrade head
#
# En el arranque de la aplicacion la migracion la ejecuta
# app.migrations.upgrade_database(); ver DEPLOY.md.
# ============================================================================

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Nombres de archivo ordenables: 0001_baseline.py, 0002_....py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
