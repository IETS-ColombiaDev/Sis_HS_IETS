# Blueprint Render — Sis_HS_IETS
# https://sis-hs-iets.onrender.com
#
# Un solo proceso + SQLite (el entrypoint fuerza WEB_CONCURRENCY=1 si no hay
# Postgres). Defina BOOTSTRAP_ADMIN_* en el panel para el primer ingreso con
# contraseña. La imagen fija ENVIRONMENT=production y ALLOW_DEV_LOGIN=false: no
# los cambie en el panel, porque con ENVIRONMENT=development el acceso sin
# contraseña queda abierto a cualquier correo del dominio (RNF12).
#
# La base se copia a Firestore y se restaura al arrancar. La copia guarda puntos
# de recuperación (antes de cada despliegue, cierre del día): ver DEPLOY.md,
# "SQLite con copia en Firestore".
services:
  - type: web
    name: sis-hs-iets
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      # Vigilancia programada y cola de ingesta en el mismo proceso. Desde el
      # 19 oct 2026 el escaneo ya no deja escrituras abiertas durante la red, y
      # una prueba de 5 min con vigilancia + 6 usuarios dio 0 bloqueos de SQLite.
      - key: INGEST_WORKER_ENABLED
        value: "true"
      - key: INGEST_WORKER_FORCE
        value: "true"
      # Render gratuito: 0,1 CPU y 512 MB. Una fuente a la vez; con varias el
      # proceso se quedaba sin memoria, se reiniciaba y la vigilancia quedaba en 0.
      - key: INGEST_MAX_PARALLEL
        value: "1"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/data/iets_horizonte.db
      - key: CORS_ORIGINS
        value: https://sis-hs-iets.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://sis-hs-iets.onrender.com
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: sistema-permisos-iets
      - key: FIREBASE_DB_ENABLED
        value: "true"
      - key: FIREBASE_DB_DATABASE
        value: hs-iets
      - key: FIREBASE_DB_COLLECTION
        value: hs_iets_db
      - key: FIREBASE_DB_LOCATION
        value: nam5
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # IA (MiniMax). Obligatoria: la llave ya no esta en el codigo. Ponga el
      # valor a mano en el panel de Render (Environment); sin ella la IA queda
      # en modo degradado.
      - key: MINIMAX_API_KEY
        sync: false
