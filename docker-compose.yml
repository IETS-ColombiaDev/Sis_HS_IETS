# ============================================================================
#  Sistema de Escaneo de Horizonte del IETS - pila de produccion (P0-2)
# ============================================================================
#   cp deploy/.env.production.example deploy/.env.production   # y completelo
#   docker compose --env-file deploy/.env.production build
#   docker compose --env-file deploy/.env.production up -d
#   docker compose --env-file deploy/.env.production --profile https up -d   # + Caddy
#
# Servicios:
#   db      PostgreSQL 15 con volumen persistente y healthcheck.
#   api     FastAPI + SPA, WEB_CONCURRENCY procesos, SIN worker de ingesta.
#   worker  Misma imagen, 1 proceso, INGEST_WORKER_ENABLED=true, sin puertos.
#           Es el unico que recorre la cola ingest_jobs. Opcional: si lo quita,
#           ponga en api WEB_CONCURRENCY=1 e INGEST_WORKER_ENABLED=true.
#   caddy   (perfil "https") proxy con certificados automaticos.
# Ver DEPLOY.md.
# ============================================================================
name: iets-horizonte

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en deploy/.env.production}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-iets}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en deploy/.env.production}@db:5432/${POSTGRES_DB:-iets_horizonte}}
  # Solo la red interna y 127.0.0.1 llegan al puerto de uvicorn (ver ports).
  FORWARDED_ALLOW_IPS: "*"

x-app: &app
  image: iets-horizonte:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - deploy/.env.production
  restart: unless-stopped
  # Montaje opcional de la cuenta de servicio de Firestore (RRHH):
  # volumes:
  #   - ./deploy/secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iets_horizonte}
      POSTGRES_USER: ${POSTGRES_USER:-iets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en deploy/.env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin puertos publicados: solo api y worker lo alcanzan por la red interna.
    # Para administrarlo: docker compose exec db psql -U iets iets_horizonte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb

  api:
    <<: *app
    environment:
      <<: *app-env
      INGEST_WORKER_ENABLED: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: *app-env
      INGEST_WORKER_ENABLED: "true"
      WEB_CONCURRENCY: "1"
      # La api ya migro y sembro; el worker solo arranca su proceso.
      RUN_MIGRATIONS: "false"
    # Sin puertos: su HTTP interno solo lo usa el healthcheck de la imagen.
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
