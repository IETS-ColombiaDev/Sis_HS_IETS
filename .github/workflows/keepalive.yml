# Mantiene despierto el servicio de Render (plan free): sin trafico durante
# 15 min Render lo apaga, el siguiente ingreso tarda ~70 s y el disco efimero
# (SQLite) se pierde. Un ping cada 10 min evita ambas cosas.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 120 https://sis-hs-iets.onrender.com/api/health; then
              exit 0
            fi
            sleep 15
          done
          exit 1
